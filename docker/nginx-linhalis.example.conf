# Replace these placeholders before enabling:
# - superset.seu-dominio.com
# - keycloak.seu-dominio.com
# - SSL certificate paths
# - Keycloak upstream port if it differs from 8080
#
# Keycloak behind this proxy should use KC_PROXY_HEADERS=xforwarded
# or proxy-headers=xforwarded in keycloak.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream linhalis_superset {
    server 127.0.0.1:8088;
    keepalive 32;
}

upstream linhalis_keycloak {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name superset.seu-dominio.com keycloak.seu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name superset.seu-dominio.com;

    ssl_certificate /etc/letsencrypt/live/superset.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superset.seu-dominio.com/privkey.pem;

    client_max_body_size 200m;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://linhalis_superset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl http2;
    server_name keycloak.seu-dominio.com;

    ssl_certificate /etc/letsencrypt/live/keycloak.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keycloak.seu-dominio.com/privkey.pem;

    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://linhalis_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
